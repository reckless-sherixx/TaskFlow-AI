services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taskflow

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://redis:6379
      BUN_CONFIG_DNS_RESOLVER: system
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taskflow

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      REDIS_URL: redis://redis:6379
      BUN_CONFIG_DNS_RESOLVER: system
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - taskflow

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    depends_on:
      - app
    networks:
      - taskflow

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./docker/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./docker/grafana/dashboard.json:/var/lib/grafana/dashboards/taskflow.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - taskflow

networks:
  taskflow:
    driver: bridge

volumes:
  redis_data:
  prom_data:
  grafana_data:
